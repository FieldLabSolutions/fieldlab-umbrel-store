version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service-name>_1
      APP_HOST: fieldlab-miner-controller_web_1
      APP_PORT: 8080

  web:
    # Public multi-arch image (linux/arm64 + linux/amd64). Pinned by digest.
    image: ghcr.io/fieldlabsolutions/miner-controller:1.5.17@sha256:c40b5fc87671baae33fbfd6224cd7e5bbcc9dd0088326aba382dd6710d206990
    restart: on-failure
    user: "1000:1000"
    init: true
    stop_grace_period: 30s
    # Loopback-only for the fieldlab-cloudflared tunnel; does not conflict with Umbrel app_proxy on :8742.
    ports:
      - "127.0.0.1:18742:8080"
    environment:
      TZ: America/Chicago
      # Browser POSTs arrive through Umbrel's app proxy; allow exactly these origins.
      # Add your Umbrel LAN origin too, e.g. "http://umbrel.local:8742,http://<UMBREL_LAN_IP>:8742"
      MINER_OPS_TRUSTED_ORIGINS: "http://192.168.4.60:8742,http://umbrel.local:8742,https://miners.dirtyjerseywhore.com"
    volumes:
      # state.json, changes.csv, controller.log, metrics.sqlite3, shadow.csv, ha_token
      - ${APP_DATA_DIR}/data:/data
