manifestVersion: 1
id: fieldlab-miner-controller
name: Miner Controller 3000
tagline: Weather-driven heat controller for the home miners (Avalon Qs + BitAxe)
icon: https://raw.githubusercontent.com/FieldLabSolutions/fieldlab-umbrel-store/main/fieldlab-miner-controller/icon.png
category: bitcoin
version: "1.6.8"
port: 8742
description: >-
  Private LAN controller for home Avalon Q miners and BitAxes.
  Picks Eco/Standard/Standby from outside temperature (NWS KGGG) with hysteresis and a
  30-minute minimum between changes, holds mode if weather is missing, never picks Super
  in auto. Read-only Home Assistant indoor sensors (shadow log only). Only allowlisted
  miner commands; no pool, worker, wallet or payout changes.
developer: Miner Ops (private)
website: ""
submitter: Miner Ops
submission: ""
repo: ""
support: ""
gallery: []
releaseNotes: >-
  1.6.8: Apollo Eco / Balanced / Turbo now work on older Apollo OS that does
  not have a nodeSoftware setting (1.6.7 could not read the mode or apply a
  change on those units). The card also shows the current mode after login.
  Includes 1.6.7 (Apollo temps, fans, power and mode buttons).


  1.6.7: FutureBit Apollo II now shows temperatures, fan speeds, power and
  hashrate on its card and in Full details. Tap "Apollo login" on the Apollo
  card and save the Apollo password once (stored privately on this Umbrel).
  Then Eco / Balanced / Turbo buttons change the Apollo's mode; hashing pauses
  for about 40 seconds while the miner program restarts. No pool, fan or
  reboot controls. Includes 1.6.6 (Avalon Cooling tiles) and 1.6.5 (Full
  details on every miner card).


  1.6.6: Avalon Full details now opens with a Cooling block of big tiles for heat
  experiments: intake temperature (°C and °F), hashboard in/out and the rise between
  them, chip average/max/target, fan % and average fan RPM. Includes 1.6.5 (Full
  details on every miner card) and 1.6.4 (OCEAN warning only while on Datum).


  1.6.5: Full details on every miner card. Tap a miner to expand it and the new
  Full details panel shows everything the miner reports, read-only: chip and
  hashboard temperatures (°C and °F) with the hottest chips, fans, power,
  voltage and efficiency, realtime vs 1/5/15-minute vs average hashrate, shares,
  rejects and hardware errors, every pool slot (payout addresses masked),
  firmware and MAC. BitAxe shows its full AxeOS stats; Apollo shows what the
  ETBC pool switch sees. Includes 1.6.4 (OCEAN warning only while on Datum).


  1.6.4: The OCEAN "little or no hashrate" warning only applies while the Pool
  switch is on Datum. On Solo ETBC or Block Party it is skipped and an existing
  OCEAN problem clears right away. After switching back to Datum it waits 30
  minutes (OCEAN's stats lag) before it can warn again.


  1.6.3: When outside is below 50°F, the Lab indoor target rises to at least
  72°F (same ±1.5 band, with 1°F switch hysteresis). The Outside card shows
  the active target and why (for example, cold boost: outside <50F).

  1.6.2: The Lab miner can follow the Lab indoor sensor against the indoor
  target (Super when the room is below target, step down near or above it).
  The 96°C chip guard still applies. Other miners still follow outside
  temperature. The Outside forecast now loads even when a miner is in Super.

  1.6.1: Pool switch. A new Pool control in the header picks where every miner on the ETBC Pool switch mines:
  Datum, Block Party or Solo ETBC. Block Party now flips the switch at the start of the window and puts it back
  to whatever it was on when the window ends. Needs ETBC Pool 0.2.2. "Our pool" now reads "Solo ETBC".


  1.5.21: Block Party can switch miners to Rigly up to 30 minutes before the official start
  (slider in Edit party settings, 0–30 in steps of 5; default 0). The status box still shows the
  official next party time and, when early is set, when miners will actually switch. Edit party
  settings now shows the full Rigly worker (with copy) and labels the optional bc1 field clearly.
  BitAxe status detects a Rigly pool slot anywhere in the pool list, not only when it is active.

  1.5.20: Block Party no longer runs every day when left on. Pick which days of the week
  the window applies (default Saturday only). The quick-look box shows scheduled days and the
  next party start; day checkboxes are in Edit party settings. Cross-midnight windows still
  count the early-morning hours after the selected start day. Leave Block Party on all week
  without flips on non-party days.

  1.5.19: The Block Party card now opens with a live status box: party on or off, in or out of
  the window, whether each miner is mining to the party right now, the payout address currently
  on the Avalons' Rigly slot, a Copy button, and when it was last checked. All editing (window,
  payout address, party eco, Avalon admin password) is in a collapsed Edit party settings
  expander. Saving a new payout address, after confirm, updates the existing Rigly slot on each
  miner. DATUM and OCEAN slots are not changed, and miners are not rebooted automatically.

  1.5.18: Block Party settings now show the full Rigly payout address and the full worker name
  in plain text, with a copy button. The prefix is never shortened. If no payout address is set,
  the card says so plainly.

  1.5.17: Alerts and saved status now follow a miner when its IP changes, are removed with removed miners, and leftovers are cleaned up at startup.

  1.5.16: Edit on built-in miners now edits in place instead of adding a duplicate card; Add refuses duplicates.

  1.5.15: Settings now has a Restart app button, and the same restart control appears after you save a miner or settings change that needs a restart.

  1.5.14: Each miner card now has an Edit button to change its IP, name, alias, and room.
  Restart the app after an IP change.

  1.5.13: Each miner card now shows a badge for the pool it is using right now: DATUM, Our pool, Block Party,
  OCEAN, or a warning for a solo ckpool fallback.

  1.5.12: Adds an Add Miner button (next to Block Party; alias and all settings, editable later) and an
  Add / Edit Room button next to the title. Heat control, pools and Block Party are unchanged.

  1.5.11: The Outside graph now has a Now line with a dot on the curve, and Now sits in the middle: the
  last 24 hours of real readings (gray) on the left, the next 24 hours of forecast (orange) on the right.
  It slides along as the day goes on. Heat control, pools and Block Party are unchanged.

  1.5.10: On phones, House and Lab now start as small cards showing the miner count, hashrate and room
  temp with the room color; tap one to open the full card, tap the X to shrink it back. Desktop is
  unchanged. Heat control, pools and Block Party are unchanged.

  1.5.9: House and the OCEAN earnings card now run full width like the Lab. OCEAN shows just the unpaid
  BTC, next-block estimate and last 24h; tap it for the full details. Heat control, pools and Block Party
  are unchanged.

  1.5.8: The House now gets its own square like the Lab: House temp (big) on the right and the House
  Avalon Q as a row inside, tap it for the full view and Go to device. Another House miner just needs its
  IP added to house_group. The separate House temp tile and House miner card are gone. Heat control and
  Block Party are unchanged.

  1.5.7: Miner Controller 3000. The header is one neat line: name with version and update time on the left,
  the Outside temp card in the middle, Block Party with its switch on the right. Tapping either card opens
  it in the middle of the screen; close with the X, Esc or a tap outside. The 1h/24h/7d/30d/6mo buttons
  moved down above the chart. The Outside panel shows the coming temperature swings (next 48 hours) and lets
  you look up a ZIP and save it as your location for good. Backup-station notes and warnings are gone.
  Block Party settings and behavior are unchanged.

  1.5.6: Outside temp is now an expandable card at the top of the header: tap it for details and to set the
  weather location by ZIP code (nearest NWS station plus fallbacks; Reset to Longview (KGGG)). The Block Party
  card sits on the right of the header: its switch flips without opening the card, and all Block Party
  settings now live inside that card instead of the Settings page. Tiers and hysteresis are unchanged.

  1.5.5: New Lab square: the Lab temp, the Lab Avalon Q (.85), the BitAxe and the new FutureBit Apollo
  share one card; the top strip shows Outside and House. The Apollo is watched read-only
  (is its web page answering): hashrate and pool show as unknown until a stats source is added. Offline
  alert after 3 missed checks, with an "Apollo enabled" switch in Settings. Editable nickname. The Apollo
  is never written to and is not in Block Party or the heat schedule.
  1.5.4: Dashboard renamed to Miner Controller. Outside, Lab and House temps now sit side by side as big
  numbers in one card (stale readings marked). Block Party is a slim one-row bar; tap it for details.
  Fixes a false "still on Rigly outside the window" banner right after a restore (it read the BitAxe sample
  taken before the restore); a fresh reading still on Rigly still raises it.
  1.5.3: BitAxe Block Party fixed for AxeOS 2.15 (pool list): if a Rigly pool is already on the BitAxe it
  becomes primary with DATUM as fallback, and swaps back after. Checks the switch actually took and
  shows every skip reason on the dashboard.
  1.5.2: Fixes "pool slots unreadable" on Avalon Qs (they list only configured slots). If a Q already
  has a Rigly pool slot, Block Party now switches by priority only: no slot rewrite, no reboot, no
  password needed, and switches back to DATUM after.
  1.5.1: Block Party now moves the Avalon Qs too, once you enter the Avalon admin password
  (typed twice) in Settings. Rigly goes in pool slot 1 with DATUM kept as backup, one reboot each
  way, saved pools put back exactly after, and the work mode is checked and put back after each reboot.
  Without the password the Avalon Qs stay on DATUM.
  1.5.0: Block Party on/off switch on the dashboard (ships OFF). Daily window, default 9 AM to 5 PM CT,
  editable in Settings. BitAxe switches to Rigly (solo.ckpool.org:3333) in the window and back to its saved
  DATUM pool after; Avalon Qs stay on DATUM. Fixed Rigly prefix plus an editable worker suffix.
  1.4.9: Cleaner dashboard. Each miner is a compact card (picture, name, IP, hashrate, mode,
  alert badges); tap it for the full details and a big "Go to device" button. BitAxe graphs removed.
  1.4.8: "Heaters" renamed to "miners". The OCEAN low-hashrate alert now shows which address
  it checks (masked), when OCEAN last saw hashrate for it, and how to fix it; after a payout
  address change it shows a yellow "waiting for OCEAN" note for 45 minutes instead.
