manifestVersion: 1
id: fieldlab-miner-controller
name: Miner Controller 3000
tagline: Weather-driven heat controller for the home miners (Avalon Qs + BitAxe)
icon: https://raw.githubusercontent.com/FieldLabSolutions/fieldlab-umbrel-store/main/fieldlab-miner-controller/icon.png
category: bitcoin
version: "1.5.11"
port: 8742
description: >-
  Private LAN controller for home Avalon Q miners and BitAxes.
  Picks Eco/Standard/Standby from outside temperature (NWS KGGG) with hysteresis and a
  30-minute minimum between changes, holds mode if weather is missing, never picks Super
  in auto. Read-only Home Assistant indoor sensors (shadow log only). Only allowlisted
  miner commands; no pool, worker, wallet or payout changes.
