tagline: Podcasting 2.0 boosts from its own separate Lightning wallet
description: >-
  Local-only web app with its own built-in LND wallet (separate seed, separate channels,
  neutral alias, outbound over Tor, no inbound). Uninstalling the app deletes that wallet:
  back up the 24 words shown at setup. Search Podcast Index or paste an RSS
  feed, review the show's value block payees and splits, and send boosts (keysend or
  Lightning address). Also pay BOLT11 invoices and create invoices with a QR code.
  Ships in DRY_RUN mode by default.
