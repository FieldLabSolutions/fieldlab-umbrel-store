version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: fieldlab-boost_web_1
      APP_PORT: 8080
    container_name: fieldlab-boost_app_proxy_1

  web:
    image: node:20-alpine
    user: "1000:1000"
    init: true
    restart: on-failure
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      # Holds history, saved shows, the baked macaroon, and the LND dir (data/lnd)
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: 8080
      DATA_DIR: /data
      LND_REST: https://${APP_BOOST_LND_IP}:${APP_BOOST_LND_REST_PORT}
      TLS_CERT_PATH: /data/lnd/tls.cert
      # Baked by the app on first use from admin.macaroon (see README)
      MACAROON_PATH: /data/boost-node.macaroon
      ADMIN_MACAROON_PATH: /data/lnd/data/chain/bitcoin/${APP_BOOST_NETWORK}/admin.macaroon
      WALLET_PASSWORD_FILE: /data/lnd/wallet-password
      DRY_RUN: "false"
      SENDER_NAME: ""
      MAX_PAYMENT_SATS: "50000"
      # Optional Podcast Index search (leave empty to disable)
      PODCASTINDEX_KEY: ""
      PODCASTINDEX_SECRET: ""

  lnd:
    image: lightninglabs/lnd:v0.21.6-beta@sha256:54b3c87ad0bc3fea3fab8af23ace6421147ea97e6b56bf3911592d7853c185b8
    entrypoint: ["/bin/sh", "-c"]
    # 1) Wallet reset: the web app only writes RESET_PENDING (never deletes while LND runs). On the next
    #    start, before LND launches, keep a copy of channel.backup, then wipe wallet state (data/chain,
    #    data/graph, wallet-password). tls.cert/tls.key are kept.
    # 2) Add auto-unlock only once the setup screen has written the password file.
    command:
      - 'if [ -f /data/.lnd/RESET_PENDING ]; then mkdir -p /data/.lnd/channel-backup; for f in /data/.lnd/data/chain/bitcoin/*/channel.backup; do if [ -f "$$f" ]; then cp "$$f" /data/.lnd/channel-backup/pre-reset-$$(date +%Y%m%d%H%M%S).backup; fi; done; rm -rf /data/.lnd/data/chain /data/.lnd/data/graph /data/.lnd/wallet-password && rm -f /data/.lnd/RESET_PENDING && echo "wallet reset done"; fi; if [ -s /data/.lnd/wallet-password ]; then exec lnd $$0 --wallet-unlock-password-file=/data/.lnd/wallet-password --wallet-unlock-allow-create; else exec lnd $$0; fi'
      - "${APP_BOOST_LND_COMMAND}"
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 1m
    # No ports published: reachable only by the web container on Umbrel's internal network.
    volumes:
      - ${APP_DATA_DIR}/data/lnd:/data/.lnd
    environment:
      HOME: /data
    networks:
      default:
        ipv4_address: $APP_BOOST_LND_IP
