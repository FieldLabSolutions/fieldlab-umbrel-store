name: fieldlab-boost image
on:
  push:
    branches: [main, master]
    paths: ["fieldlab-boost/app/**", "fieldlab-boost/Dockerfile", ".github/workflows/fieldlab-boost-image.yml"]
    tags: ["fieldlab-boost-v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd fieldlab-boost/app && npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: ver
        run: echo "v=$(node -p "require('./fieldlab-boost/app/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: fieldlab-boost
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/fieldlabsolutions/fieldlab-boost:${{ steps.ver.outputs.v }}
            ghcr.io/fieldlabsolutions/fieldlab-boost:latest
      - run: |
          echo "Image: ghcr.io/fieldlabsolutions/fieldlab-boost:${{ steps.ver.outputs.v }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
