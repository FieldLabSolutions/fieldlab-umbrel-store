version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: fieldlab-local-vault_web_1
      APP_PORT: 8080

  web:
    # Public multi-arch image (linux/amd64 + linux/arm64). Pinned by digest after CI build.
    image: ghcr.io/fieldlabsolutions/fieldlab-local-vault:1.1.0@sha256:645da01bdbe307dd75b81721299998e2c75bfc067af05324b9ed01258c44eccc
    restart: on-failure
    user: "1000:1000"
    init: true
    stop_grace_period: 30s
    ports:
      # HTTPS vault UI on the Umbrel LAN (WebCrypto secure context). Not exposed via app proxy.
      - "${APP_LOCAL_VAULT_HTTPS_PORT:-8449}:8449"
    environment:
      VAULT_HTTP_PORT: 8080
      VAULT_HTTPS_PORT: 8449
      VAULT_DATA: /data
      VAULT_CERT: /cert/tls.crt
      VAULT_KEY: /cert/tls.key
      # Comma-separated LAN IPs for the vault HTTPS certificate (defaults include detected LAN IP and 192.168.4.99)
      VAULT_CERT_IPS: "${APP_LOCAL_VAULT_CERT_IPS:-}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/cert:/cert
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:size=8m,mode=1777
