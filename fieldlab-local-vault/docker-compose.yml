version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: fieldlab-local-vault_web_1
      APP_PORT: 8080

  web:
    # Public multi-arch image (linux/amd64 + linux/arm64). Pinned by digest after CI build.
    image: ghcr.io/fieldlabsolutions/fieldlab-local-vault:1.0.3
    restart: on-failure
    user: "1000:1000"
    init: true
    stop_grace_period: 30s
    ports:
      # HTTPS vault UI on the Umbrel LAN (WebCrypto secure context). Not exposed via app proxy.
      - "${APP_LOCAL_VAULT_HTTPS_PORT:-8449}:8449"
    environment:
      VAULT_HTTP_PORT: 8080
      VAULT_HTTPS_PORT: 8449
      VAULT_DATA: /data
      VAULT_CERT: /cert/tls.crt
      VAULT_KEY: /cert/tls.key
      # Optional: append to the generated cert SAN, e.g. "IP:192.168.1.50"
      VAULT_CERT_SAN_EXTRA: "${APP_LOCAL_VAULT_CERT_SAN_EXTRA:-}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/cert:/cert
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:size=8m,mode=1777
