releaseNotes: >-
  1.1.0: Photos & Videos — a second password, chunked AES-256-GCM media (up to 4 GiB per item),
  encrypted thumbnails, grid view, streaming video via Service Worker, separate .lvmedia export,
  and a 2-minute media auto-lock (configurable). Master and media sessions are independent; media
  is stored under data/media/ and is excluded from .lvbak backups.
  1.0.5: Local CA and CA-signed HTTPS cert (SANs include your LAN IP, umbrel.local, localhost).
  HTTP landing redirects to the vault login; /ca documents installing the CA on Windows (Trusted Root)
  and Android (Settings > Security > Encryption & credentials > Install a certificate > CA certificate).
  Set APP_LOCAL_VAULT_CERT_IPS for extra LAN IPs. Existing vault data is unchanged.
  1.0.4: Add a wallet backup type with BIP39 English word entry (12/24 plus 15/18/21), bundled
  wordlist, 4-letter auto-fill, checksum validation, optional BIP39 passphrase, hidden-by-default
  words, and file attachments. Search matches wallet name/notes only, never seed words. Browser
  favicon and apple-touch icon on the HTTPS vault and HTTP landing pages.
  1.0.3: Files live inside notes with encrypted label and description. Attach from the note editor;
  search matches labels and descriptions. Existing standalone files migrate into an "Unfiled files"
  note on unlock. Export/import supports the new structure and still reads 1.0.x backups.
  1.0.2: Fixes the landing-page link (HTTP app proxy → HTTPS :8449) blocked by cross-site request
  guards. Top-level navigation to the vault UI is allowed; API and mutating requests stay protected.
  Bumped version so Umbrel offers the update (same-version digest-only changes are not surfaced).
  1.0.1: Ships data/ and cert/ in the store so Umbrel creates them as uid 1000 (fixes root-owned
  app-data crash on first install). Entrypoint exits with a clear message if data or cert is not writable.
  1.0.0: Initial release — HTTP landing via app proxy; HTTPS vault on LAN port 8449.
submitter: Field Lab
