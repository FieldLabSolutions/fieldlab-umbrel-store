# UNTESTED
version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: fieldlab-sovereign-btc-stack_web_1
      APP_PORT: 3880
  web:
    image: ghcr.io/fieldlabsolutions/sovereign-btc-stack:2.4.0@sha256:9c435351d0c4b7c7a7e601dcdc75c099e511af1df30011b950ea5dd4751e4564
    restart: on-failure
    user: "1000:1000"
    read_only: true
    environment:
      PORT: 3880
      # No install requirements: Core RPC details are optional (set BITCOIN_RPC_USER/PASS later).
      APP_DATA_DIR: /umbrel-app-data
      DATA_PATH: /host-data
      HISTORY_FILE: /data/history.json
      # ALERT_WEBHOOK_URL: ""   # off by default
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/app-data:/umbrel-app-data:ro   # UNVERIFIED that Umbrel allows this mount
      - ${UMBREL_ROOT}:/host-data:ro                  # for disk usage of /mnt/data (UNVERIFIED)
